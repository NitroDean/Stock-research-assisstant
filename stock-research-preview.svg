<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">Stock Research Assistant interface overview</title>
  <desc id="description">A dark blue research dashboard with a document-grounded question, an answer, clickable citations, and a four-file Apple PDF collection.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b172c"/>
      <stop offset="1" stop-color="#152d46"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#37d5b0"/>
      <stop offset="1" stop-color="#80e2c0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="660" rx="28" fill="url(#background)"/>
  <circle cx="1115" cy="95" r="165" fill="#1f4963" opacity=".35"/>
  <circle cx="94" cy="590" r="180" fill="#143b50" opacity=".4"/>
  <text x="66" y="74" fill="#70d9bd" font-size="17" font-family="Arial,sans-serif" font-weight="700" letter-spacing="2">LOCAL AI · US STOCKS</text>
  <text x="66" y="121" fill="#f3f7fb" font-size="34" font-family="Arial,sans-serif" font-weight="700">Stock Research Assistant</text>
  <text x="66" y="155" fill="#b7c9d6" font-size="17" font-family="Arial,sans-serif">Ask questions about company reports. Check the page behind every answer.</text>
  <rect x="66" y="190" width="690" height="397" rx="20" fill="#f7fafc" filter="url(#shadow)"/>
  <rect x="778" y="190" width="356" height="397" rx="20" fill="#f7fafc" filter="url(#shadow)"/>
  <rect x="66" y="190" width="690" height="62" rx="20" fill="#e6f2f0"/>
  <rect x="66" y="232" width="690" height="20" fill="#e6f2f0"/>
  <text x="92" y="229" fill="#1b4756" font-size="19" font-family="Arial,sans-serif" font-weight="700">Ask your documents</text>
  <rect x="96" y="277" width="523" height="56" rx="13" fill="#e9eef3"/>
  <text x="114" y="302" fill="#21374d" font-size="16" font-family="Arial,sans-serif">What changed in Apple's net sales</text>
  <text x="114" y="323" fill="#21374d" font-size="16" font-family="Arial,sans-serif">between fiscal 2025 and 2026?</text>
  <rect x="195" y="350" width="526" height="128" rx="13" fill="#e2f6ef"/>
  <text x="215" y="380" fill="#1e3d4b" font-size="16" font-family="Arial,sans-serif">Apple reported higher total net sales in 2026.</text>
  <text x="215" y="408" fill="#1e3d4b" font-size="16" font-family="Arial,sans-serif">The cited filing shows both years' figures.</text>
  <rect x="215" y="429" width="239" height="31" rx="15" fill="#b6e8da"/>
  <text x="230" y="450" fill="#135b56" font-size="14" font-family="Arial,sans-serif" font-weight="700">2026 Form 10-K · page 29 ↗</text>
  <rect x="96" y="505" width="625" height="50" rx="12" fill="#fff" stroke="#c9d9e1" stroke-width="2"/>
  <text x="115" y="536" fill="#728697" font-size="15" font-family="Arial,sans-serif">Ask about a company, trend, or risk...</text>
  <rect x="778" y="190" width="356" height="62" rx="20" fill="#e6f2f0"/>
  <rect x="778" y="232" width="356" height="20" fill="#e6f2f0"/>
  <text x="805" y="229" fill="#1b4756" font-size="19" font-family="Arial,sans-serif" font-weight="700">Document collection</text>
  <text x="805" y="291" fill="#577080" font-size="14" font-family="Arial,sans-serif" font-weight="700">4 APPLE FILINGS LOADED</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#21485a">
    <rect x="804" y="308" width="305" height="49" rx="10" fill="#e8f0f4"/>
    <text x="822" y="339">📄  Apple-2026-10K.pdf</text>
    <rect x="804" y="367" width="305" height="49" rx="10" fill="#e8f0f4"/>
    <text x="822" y="398">📄  Apple-2025-10K.pdf</text>
    <rect x="804" y="426" width="305" height="49" rx="10" fill="#e8f0f4"/>
    <text x="822" y="457">📄  Apple-2026-Q3-10Q.pdf</text>
    <rect x="804" y="485" width="305" height="49" rx="10" fill="#e8f0f4"/>
    <text x="822" y="516">📄  Apple-2026-Q2-10Q.pdf</text>
  </g>
  <rect x="66" y="611" width="16" height="16" rx="8" fill="url(#accent)"/>
  <text x="92" y="625" fill="#a6c3cb" font-size="14" font-family="Arial,sans-serif">PDF-grounded answers · local models · clickable source pages</text>
</svg>
